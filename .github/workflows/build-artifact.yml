name: Build Artifact

# Phase 1 of immutable artifact promotion: BUILD ONCE per commit.
# Builds core + dashboard images, tags them with the commit SHA, and pushes to GHCR.
# This runs in PARALLEL to Render's existing git build and does NOT change any live
# deploy. The SHA tag is the immutable artifact that Phase 2 (promote.yml) promotes.
# See docs/IMPACT_REPORT_artifact_promotion_cicd.md.

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    paths:
      - '.github/workflows/build-artifact.yml'
      - 'apps/core/cardbey-core/Dockerfile'
      - 'apps/dashboard/cardbey-marketing-dashboard/Dockerfile'
  workflow_dispatch:

concurrency:
  group: build-artifact-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  compute:
    name: Compute image namespace
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - id: vars
        name: Lowercase repository owner (GHCR requires lowercase)
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build-core:
    name: Build core image
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.compute.outputs.owner }}/cardbey-core
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build core image (no cache; prove image before enabling gha cache)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: apps/core/cardbey-core
          file: apps/core/cardbey-core/Dockerfile
          push: false
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push core
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: apps/core/cardbey-core
          file: apps/core/cardbey-core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dashboard:
    name: Build dashboard image
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove submodule token present (no value)
        env:
          CARDBEY_SUBMODULE_TOKEN: ${{ secrets.CARDBEY_SUBMODULE_TOKEN }}
        run: |
          if [ -z "$CARDBEY_SUBMODULE_TOKEN" ]; then
            echo "secret_present=false secret_name=CARDBEY_SUBMODULE_TOKEN"
            echo "GitHub Actions rejects custom secrets named GITHUB_*; workflows read CARDBEY_SUBMODULE_TOKEN."
            exit 1
          fi
          echo "secret_present=true secret_name=CARDBEY_SUBMODULE_TOKEN"

      - name: Init private dashboard submodule
        env:
          CARDBEY_INIT_DASHBOARD_SUBMODULE: 'true'
          CARDBEY_SUBMODULE_TOKEN: ${{ secrets.CARDBEY_SUBMODULE_TOKEN }}
          GITHUB_SUBMODULE_TOKEN: ${{ secrets.CARDBEY_SUBMODULE_TOKEN }}
        run: node scripts/init-private-dashboard-submodule.mjs

      - name: Assert dashboard submodule SHA
        run: node scripts/ci-assert-dashboard-submodule.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.compute.outputs.owner }}/cardbey-dashboard
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build dashboard image (no cache; prove image before enabling gha cache)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/cardbey-marketing-dashboard/Dockerfile
          push: false
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push dashboard
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          # Context is the monorepo root (pnpm workspace + submodules).
          context: .
          file: apps/dashboard/cardbey-marketing-dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

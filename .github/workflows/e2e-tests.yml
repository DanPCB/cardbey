name: E2E Tests (Performer)

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'apps/dashboard/cardbey-marketing-dashboard/**'
      - 'apps/core/cardbey-core/src/intent/**'
      - 'apps/core/cardbey-core/src/routes/performerIntakeV2Routes.js'
      - 'apps/core/cardbey-core/src/lib/intake/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'apps/dashboard/cardbey-marketing-dashboard/**'
      - 'apps/core/cardbey-core/src/intent/**'
      - 'apps/core/cardbey-core/src/routes/performerIntakeV2Routes.js'
      - 'apps/core/cardbey-core/src/lib/intake/**'
      - '.github/workflows/e2e-tests.yml'

jobs:
  performer-e2e:
    name: Performer E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard/cardbey-marketing-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Performer E2E suite
        run: pnpm run test:e2e -- --grep-invert "live contract"
        env:
          CI: 'true'
          DASHBOARD_BASE_URL: http://127.0.0.1:5174

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/cardbey-marketing-dashboard/playwright-report/
          if-no-files-found: ignore

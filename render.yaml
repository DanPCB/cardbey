services:
  # Core API (staging)
  - type: web
    name: cardbey-core-staging
    runtime: node
    repo: https://github.com/DanPCB/cardbey
    branch: staging
    rootDir: apps/core/cardbey-core
    # DATABASE_URL must be Postgres; applies prisma/postgres/migrations before generate (belt + suspenders with preDeploy/prestart bootstrap).
    buildCommand: npm install && npx prisma migrate deploy --schema=prisma/postgres/schema.prisma && npm run build && (pip install crewai crewai-tools --quiet || echo "pip not available, CrewAI disabled")
    # DATABASE_URL must be postgresql://... (not file:). Bootstrap picks prisma/postgres/schema.prisma + migrate deploy.
    preDeployCommand: node scripts/prisma-bootstrap.js
    startCommand: npm start
    # GET /api/performer/intake/v2 → JSON { status, version, env } (not dashboard SPA HTML)
    healthCheckPath: /api/performer/intake/v2
    envVars:
      - key: NODE_ENV
        value: production
      # Runtime Kernel — Foundation + Phase B (C–E remain OFF until soak passes each phase)
      - key: ENABLE_PERFORMER_RUNTIME_KERNEL
        value: "true"
      - key: ENABLE_RUNTIME_STEP_EXECUTION
        value: "true"
      - key: ENABLE_SHARED_RUNTIME_TOOL_REGISTRY
        value: "true"
      - key: ENABLE_PROACTIVE_CAMPAIGN_RUNWAY
        value: "true"
      - key: ENABLE_RUNTIME_SESSION_REHYDRATION
        value: "true"
      - key: ENABLE_RUNTIME_STORE_FALLBACK
        value: "true"
      - key: PERFORMER_RUNTIME_UNIFIED_STREAM
        value: "true"
      # Phase B — mission orchestrator (run-next / run-all on staging only)
      - key: ENABLE_RUNTIME_MISSION_ORCHESTRATOR
        value: "true"
      # V1 — verification email hits Core API; post-verify redirect opens dashboard staging SPA
      - key: EMAIL_VERIFICATION_BASE_URL
        value: https://cardbey-core-staging.onrender.com
      - key: PUBLIC_APP_URL
        value: https://cardbey-dashboard-staging.onrender.com
      - key: DASHBOARD_URL
        value: https://cardbey-dashboard-staging.onrender.com

  # Dashboard (staging) — static site build (Vite)
  # rootDir MUST be monorepo root: Render runs "Installing dependencies with pnpm" before buildCommand
  # from rootDir; only the repo-root pnpm-lock.yaml includes workspace importers (e.g. qrcode).
  - type: web
    name: cardbey-dashboard-staging
    runtime: static
    repo: https://github.com/DanPCB/cardbey
    branch: staging
    rootDir: .
    # build:staging → vite build --mode staging → .env.staging + envVars below
    buildCommand: npm i -g pnpm@10.25.0 && pnpm -v && git submodule update --init --recursive && pnpm install --frozen-lockfile && pnpm --filter @cardbey/dashboard run build:staging
    staticPublishPath: apps/dashboard/cardbey-marketing-dashboard/dist
    envVars:
      - key: VITE_INTAKE_V2
        value: "true"
      - key: VITE_ENV
        value: staging
      - key: VITE_PERFORMER_EXECUTION_INTENTS
        value: "1"
      - key: VITE_PERFORMER_EXECUTION_PLANNER
        value: "1"
      - key: VITE_PERFORMER_EXECUTION_SERVER_BRIDGE
        value: "1"
      - key: VITE_PERFORMER_EXECUTION_REAL_CAPABILITIES
        value: "1"

  # Core API (production / live) — same build + health probe as staging; branch main tracks staging merges.
  - type: web
    name: cardbey-core
    runtime: node
    repo: https://github.com/DanPCB/cardbey
    branch: main
    rootDir: apps/core/cardbey-core
    buildCommand: npm install && npx prisma migrate deploy --schema=prisma/postgres/schema.prisma && npm run build && (pip install crewai crewai-tools --quiet || echo "pip not available, CrewAI disabled")
    preDeployCommand: node scripts/prisma-bootstrap.js
    startCommand: npm start
    healthCheckPath: /api/performer/intake/v2
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_PERFORMER_RUNTIME_KERNEL
        value: "true"
      - key: ENABLE_RUNTIME_STEP_EXECUTION
        value: "true"
      - key: ENABLE_SHARED_RUNTIME_TOOL_REGISTRY
        value: "true"
      - key: ENABLE_PROACTIVE_CAMPAIGN_RUNWAY
        value: "true"
      - key: ENABLE_RUNTIME_SESSION_REHYDRATION
        value: "true"
      - key: ENABLE_RUNTIME_STORE_FALLBACK
        value: "true"
      - key: PERFORMER_RUNTIME_UNIFIED_STREAM
        value: "true"
      - key: ENABLE_RUNTIME_MISSION_ORCHESTRATOR
        value: "true"
      - key: EMAIL_VERIFICATION_BASE_URL
        value: https://cardbey-core.onrender.com
      - key: PUBLIC_APP_URL
        value: https://cardbey-dashboard.onrender.com
      - key: DASHBOARD_URL
        value: https://cardbey-dashboard.onrender.com

  # Dashboard (production) — static site build (Vite)
  # Reconcile with existing Render service before blueprint sync if cardbey-dashboard already exists.
  - type: web
    name: cardbey-dashboard
    runtime: static
    repo: https://github.com/DanPCB/cardbey
    branch: main
    rootDir: .
    buildCommand: npm i -g pnpm@10.25.0 && pnpm -v && git submodule update --init --recursive && pnpm install --frozen-lockfile && pnpm --filter @cardbey/dashboard run build
    staticPublishPath: apps/dashboard/cardbey-marketing-dashboard/dist
    envVars:
      - key: VITE_INTAKE_V2
        value: "true"
      - key: VITE_ENV
        value: production
      - key: VITE_PERFORMER_EXECUTION_INTENTS
        value: "1"
      - key: VITE_PERFORMER_EXECUTION_PLANNER
        value: "1"
      - key: VITE_PERFORMER_EXECUTION_SERVER_BRIDGE
        value: "1"
      - key: VITE_PERFORMER_EXECUTION_REAL_CAPABILITIES
        value: "1"

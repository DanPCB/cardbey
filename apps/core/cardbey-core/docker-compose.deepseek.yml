version: '3.8'
services:
  deepseek:
    image: vllm/vllm-openai:latest
    command: --model deepseek-ai/DeepSeek-V2-Lite-Chat --port 8000 --max-model-len 32768
    ports:
      - "8000:8000"
    volumes:
      - ./models:/root/.cache/huggingface
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]